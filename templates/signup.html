<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Medico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #090d16 radial-gradient(circle at 50% 50%, #111827 0%, #030712 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            position: relative;
        }

        .brand-logo {
            position: absolute;
            top: 30px;
            left: 40px;
            color: #ffffff;
            font-weight: 700;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .signup-card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 36px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .signup-title {
            font-weight: 700;
            font-size: 1.35rem;
            color: #ffffff;
            margin-bottom: 22px;
            text-align: center;
        }

        .form-label {
            font-size: 0.78rem;
            font-weight: 500;
            color: #9ca3af;
            margin-bottom: 5px;
        }

        .form-control {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 0.88rem;
            color: #ffffff;
        }

        .form-control::placeholder {
            color: #6b7280;
        }

        .form-control:focus {
            background-color: #1f2937;
            border-color: #3b82f6;
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn-signup {
            background-color: #2563eb;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
            font-size: 0.88rem;
            color: #ffffff;
            width: 100%;
            margin-top: 14px;
        }

        .btn-google {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 9px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #d1d5db;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-google:hover {
            background-color: #374151;
            color: #ffffff;
        }

        .login-text {
            text-align: center;
            font-size: 0.78rem;
            color: #9ca3af;
            margin-top: 18px;
        }

        .login-link {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="brand-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z" />
            <path d="m8.5 8.5 7 7" />
        </svg>
        Medico
    </div>

    <div class="signup-card">
        <h2 class="signup-title">Create an account</h2>

        <form action="/signup" method="POST">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="admin@medico.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Create Password</label>

                <!-- Container for Input + Eye Icon -->
                <div class="position-relative">
                    <input type="password" id="passwordInput" name="password" class="form-control pe-5"
                        placeholder="Minimum 6 characters" minlength="6" required>

                    <!-- Eye Toggle Icon -->
                    <span onclick="togglePasswordVisibility()"
                        style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; z-index: 10; color: #a0aec0;">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn btn-signup">Create account</button>

            <a href="/login/google" class="btn btn-google d-flex align-items-center justify-content-center gap-2 text-decoration-none">
                <svg width="16" height="16" viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                </svg>
                Continue with Google
            </a>
        </form>

        <div class="login-text">
            Already have an account? <a href="/login" class="login-link">Log in</a>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('passwordInput');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                // Eye Slash Icon (When Visible)
                eyeIcon.innerHTML = `
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
            } else {
                passwordInput.type = 'password';
                // Eye Icon (When Hidden)
                eyeIcon.innerHTML = `
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
        `;
            }
        }
    </script>
</body>

</html>
