<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Medico</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><g transform='rotate(-45 32 32)'><path d='M16 20 C16 11.163 23.163 4 32 4 L32 60 C23.163 60 16 52.837 16 44 Z' fill='%232563eb'/><path d='M32 4 C40.837 4 48 11.163 48 20 L48 44 C48 52.837 40.837 60 32 60 Z' fill='%231d4ed8'/><line x1='32' y1='4' x2='32' y2='60' stroke='%23ffffff' stroke-width='4'/></g></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 24px;
        }

        .reset-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .reset-title {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .reset-subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #cbd5e1;
        }

        .form-control {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #ffffff;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            background-color: #0f172a;
            border-color: #3b82f6;
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .btn-reset {
            background-color: #2563eb;
            color: #ffffff;
            font-weight: 600;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            border: none;
            margin-top: 12px;
            transition: all 0.2s ease;
        }

        .btn-reset:hover {
            background-color: #1d4ed8;
            color: #ffffff;
        }

        .back-link {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .back-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.875rem;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="reset-card">
        <div class="brand-logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z" />
                <path d="m8.5 8.5 7 7" />
            </svg>
            Medico
        </div>

        <h2 class="reset-title">Reset Password</h2>
        <p class="reset-subtitle">Enter your new password for <strong>{{ email }}</strong></p>

        <!-- {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages[-1:] %}
        <div class="alert alert-{{ category if category != 'message' else 'info' }} p-2 small text-center mb-3"
            role="alert">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %} -->

        <form action="" method="POST">
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <div class="position-relative">
                    <input type="password" id="passwordInput" name="password" class="form-control pe-5"
                        placeholder="Minimum 6 characters" minlength="6" required>

                    <!-- Eye Toggle Icon -->
                    <span onclick="togglePasswordVisibility()"
                        style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; z-index: 10; color: #a0aec0;">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn btn-reset">Update Password</button>
        </form>

        <div class="back-text">
            Remembered your password? <a href="/login" class="back-link">Back to Login</a>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('passwordInput');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
        `;
            }
        }
    </script>
</body>

</html>
