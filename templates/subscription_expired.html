<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Expired | Medicofiles</title>
    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='images/icon-192.png') }}">
    <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='images/icon-512.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/icon-512.png') }}">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Continuous background Aurora glow pulse */
        @keyframes auroraWave {
            0% {
                transform: translate(-20%, -20%) rotate(0deg) scale(1);
            }

            50% {
                transform: translate(10%, 15%) rotate(180deg) scale(1.3);
            }

            100% {
                transform: translate(-20%, -20%) rotate(360deg) scale(1);
            }
        }

        .aurora-bg {
            animation: auroraWave 18s ease-in-out infinite alternate;
        }

        /* Meteor / Shooting Star Animation */
        .shooting-star {
            position: absolute;
            left: 50%;
            top: 50%;
            height: 2px;
            background: linear-gradient(-45deg, #60a5fa, rgba(0, 0, 255, 0));
            filter: drop-shadow(0 0 6px #38bdf8);
            animation: tail 4s ease-in-out infinite, falling 4s ease-in-out infinite;
        }

        @keyframes tail {
            0% {
                width: 0;
            }

            30% {
                width: 120px;
            }

            100% {
                width: 0;
            }
        }

        @keyframes falling {
            0% {
                transform: translateX(0) translateY(0) rotate(35deg);
            }

            100% {
                transform: translateX(1000px) translateY(1000px) rotate(35deg);
            }
        }

        /* Lock Glow & Card Glassmorphism */
        @keyframes alertPulse {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.45);
            }

            50% {
                transform: scale(1.06);
                box-shadow: 0 0 35px 12px rgba(239, 68, 68, 0.2);
            }
        }

        .lock-shield {
            animation: alertPulse 2.8s infinite ease-in-out;
        }

        .glass-box {
            background: rgba(13, 18, 36, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body
    class="bg-[#050814] text-slate-100 flex items-center justify-center min-h-screen p-4 overflow-hidden relative select-none">

    <!-- Deep Cosmic Canvas Background -->
    <canvas id="spaceCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- Flowing Aurora Plasma Light Effects -->
    <div
        class="absolute -top-40 -left-40 w-[600px] h-[600px] bg-red-600/20 rounded-full blur-[140px] pointer-events-none aurora-bg z-0">
    </div>
    <div class="absolute -bottom-40 -right-40 w-[650px] h-[650px] bg-indigo-600/25 rounded-full blur-[160px] pointer-events-none aurora-bg z-0"
        style="animation-delay: -9s;"></div>
    <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-blue-500/10 rounded-full blur-[130px] pointer-events-none z-0">
    </div>

    <!-- Real Shooting Stars (Falling Cosmic Meteors) -->
    <div class="shooting-star" style="top: 10%; left: 15%; animation-delay: 0s;"></div>
    <div class="shooting-star" style="top: 25%; left: 35%; animation-delay: 1.8s;"></div>
    <div class="shooting-star" style="top: 5%; left: 65%; animation-delay: 3.2s;"></div>

    <!-- Lock Modal Card -->
    <div class="max-w-md w-full glass-box rounded-3xl p-8 sm:p-9 text-center relative z-10 transition-all duration-300">

        <!-- Lock Badge -->
        <div class="relative w-24 h-24 mx-auto mb-6 flex items-center justify-center">
            <div
                class="w-20 h-20 rounded-2xl bg-gradient-to-br from-red-500/25 via-red-900/30 to-slate-900 border border-red-500/40 text-red-500 flex items-center justify-center text-3xl lock-shield">
                <i class="fa-solid fa-lock text-red-400 drop-shadow-[0_0_12px_rgba(239,68,68,0.8)]"></i>
            </div>
        </div>

        <h1 class="text-2xl sm:text-3xl font-black tracking-tight mb-3 text-white">
            Subscription Expired
        </h1>

        <p class="text-slate-400 text-sm mb-8 leading-relaxed">
            Your Medicofiles Subscription has been expired. Please Renew Your Subscription to get full access on
            Medicofiles and get smooth billing, inventory ...
        </p>

        <!-- Action Buttons -->
        <div class="space-y-3.5">
            <a href="{{ url_for('checkout_plan') }}"
                class="group relative flex items-center justify-center w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-700 hover:from-blue-500 hover:to-indigo-500 text-white font-bold shadow-[0_0_25px_rgba(37,99,235,0.4)] hover:shadow-[0_0_35px_rgba(37,99,235,0.65)] hover:scale-[1.02] active:scale-[0.99] transition-all duration-200 text-base">
                <i
                    class="fa-solid fa-arrows-rotate mr-2.5 transition-transform duration-500 group-hover:rotate-180"></i>
                <span>Renew Subscription Now</span>
            </a>

            <a href="{{ url_for('logout') }}"
                class="flex items-center justify-center w-full py-3 px-6 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-700/60 hover:border-slate-500 text-slate-400 hover:text-slate-200 font-semibold transition-all duration-200 text-sm">
                <i class="fa-solid fa-right-from-bracket mr-2"></i>
                <span>Logout</span>
            </a>
        </div>
    </div>

    <!-- Real-time Multi-Layer Particle & Constellation Engine -->
    <script>
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        let w, h;
        function initSize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', initSize);
        initSize();

        // Generate vibrant moving particles
        const particleCount = 110;
        const particles = [];
        const colors = ['#38bdf8', '#818cf8', '#f43f5e', '#ffffff', '#a855f7'];

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * w,
                y: Math.random() * h,
                radius: Math.random() * 2.2 + 0.8,
                color: colors[Math.floor(Math.random() * colors.length)],
                vx: (Math.random() - 0.5) * 0.9,
                vy: (Math.random() - 0.5) * 0.9,
                alpha: Math.random() * 0.7 + 0.3
            });
        }

        function renderEngine() {
            ctx.clearRect(0, 0, w, h);

            // Connect nearby particles with glowing cyber lines
            for (let i = 0; i < particleCount; i++) {
                for (let j = i + 1; j < particleCount; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 115) {
                        ctx.beginPath();
                        ctx.strokeStyle = '#6366f1';
                        ctx.globalAlpha = (1 - dist / 115) * 0.22;
                        ctx.lineWidth = 0.8;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }

            // Draw & animate particles
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0) p.x = w;
                if (p.x > w) p.x = 0;
                if (p.y < 0) p.y = h;
                if (p.y > h) p.y = 0;

                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(renderEngine);
        }
        renderEngine();
    </script>
</body>

</html>
